<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4f4f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4d4d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a1a1aa;stop-opacity:1" />
    </linearGradient>
    <clipPath id="roundRect">
      <rect x="150" y="160" width="100" height="100" rx="20"/>
    </clipPath>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <g transform="translate(200, 220)">
    <!-- Prato / circulo base -->
    <ellipse cx="0" cy="40" rx="55" ry="12" fill="#e4e4e7" opacity="0.6"/>
    <!-- Hamburguer inferior -->
    <path d="M-40 20 Q-40 35 0 35 Q40 35 40 20 Q40 10 0 10 Q-40 10 -40 20Z" fill="#d4d4d8"/>
    <!-- Carne -->
    <rect x="-35" y="0" width="70" height="14" rx="7" fill="#a1a1aa" opacity="0.7"/>
    <!-- Hamburguer superior -->
    <path d="M-42 0 Q-42 -30 0 -35 Q42 -30 42 0 Q42 5 0 5 Q-42 5 -42 0Z" fill="#d4d4d8"/>
    <!-- Detalhe semente -->
    <ellipse cx="-12" cy="-18" rx="3" ry="4.5" fill="#a1a1aa" opacity="0.4" transform="rotate(-15 -12 -18)"/>
    <ellipse cx="10" cy="-22" rx="3" ry="4.5" fill="#a1a1aa" opacity="0.4" transform="rotate(10 10 -22)"/>
    <ellipse cx="-2" cy="-28" rx="2.5" ry="4" fill="#a1a1aa" opacity="0.3" transform="rotate(-5 -2 -28)"/>
  </g>
  <text x="200" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.05em">
    Foto em breve
  </text>
</svg>
